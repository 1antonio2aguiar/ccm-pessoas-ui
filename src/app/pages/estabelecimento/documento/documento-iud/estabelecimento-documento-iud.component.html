<nb-card
  [accent]="modoEdicao ? 'info' : 'success'"
  class="dialog-card">

  <nb-card-header>
    {{ modoEdicao ? 'Editar Documento de: ' : 'Novo Documento para: ' }}
    {{ nomeEstabelecimento }}

    <button
      nbButton
      ghost
      shape="round"
      size="small"
      type="button"
      class="close-button"
      (click)="cancelar()">
      <nb-icon icon="close-outline"></nb-icon>
    </button>
  </nb-card-header>

  <nb-card-body>
    <form [formGroup]="documentoForm" (ngSubmit)="salvar()">
      <fieldset>
        <div class="row">
          <div class="col-md-12 form-group">
            <label class="label">Tipo do Documento</label>

            <nb-radio-group
              formControlName="tipoDocumento"
              class="radio-group-flex-container">
              <nb-radio value="0" class="radio-flex-item">CTPS</nb-radio>
              <nb-radio value="1" class="radio-flex-item">CNH</nb-radio>
              <nb-radio value="2" class="radio-flex-item">INSCRIÇÃO MUNICIPAL</nb-radio>
              <nb-radio value="3" class="radio-flex-item">PASSAPORTE</nb-radio>
              <nb-radio value="4" class="radio-flex-item">RESERVISTA</nb-radio>
              <nb-radio value="5" class="radio-flex-item">RG</nb-radio>
              <nb-radio value="6" class="radio-flex-item">TÍTULO DE ELEITOR</nb-radio>
              <nb-radio value="7" class="radio-flex-item">RG PARA ESTRANGEIRO</nb-radio>
            </nb-radio-group>
          </div>
        </div>

        <div class="row">
          <div class="col-md-4 form-group">
            <label for="numeroDocumento" class="label">Número do documento</label>
            <input
              nbInput
              fullWidth
              id="numeroDocumento"
              placeholder="Número do documento..."
              formControlName="numeroDocumento">
          </div>

          <div class="col-md-2 form-group">
            <label for="orgaoExpedidor" class="label">Órgão Expedidor</label>
            <input
              nbInput
              fullWidth
              id="orgaoExpedidor"
              placeholder="Órgão Expedidor..."
              formControlName="orgaoExpedidor">
          </div>

          <div class="col-md-2 form-group">
            <label for="categoriaCnh" class="label">Categoria CNH</label>
            <input
              nbInput
              fullWidth
              id="categoriaCnh"
              placeholder="Categoria CNH..."
              formControlName="categoriaCnh">
          </div>

          <div class="col-md-2 form-group">
            <label for="zona" class="label">Zona</label>
            <input
              nbInput
              fullWidth
              type="number"
              id="zona"
              placeholder="Zona..."
              formControlName="zona">
          </div>

          <div class="col-md-2 form-group">
            <label for="secao" class="label">Seção</label>
            <input
              nbInput
              fullWidth
              type="number"
              id="secao"
              placeholder="Seção..."
              formControlName="secao">
          </div>
        </div>

        <div class="row">
          <div class="col-md-3 form-group">
            <label for="dataDocumento" class="label">Data Documento</label>
            <input
              type="date"
              nbInput
              fullWidth
              id="dataDocumento"
              formControlName="dataDocumento">
          </div>

          <div class="col-md-3 form-group">
            <label for="dataExpedicao" class="label">Data Expedição</label>
            <input
              type="date"
              nbInput
              fullWidth
              id="dataExpedicao"
              formControlName="dataExpedicao">
          </div>

          <div class="col-md-3 form-group">
            <label for="dataValidade" class="label">Data Validade</label>
            <input
              type="date"
              nbInput
              fullWidth
              id="dataValidade"
              formControlName="dataValidade">
          </div>

          <div class="col-md-3 form-group">
            <label for="dataPrimeiraCnh" class="label">Data 1ª CNH</label>
            <input
              type="date"
              nbInput
              fullWidth
              id="dataPrimeiraCnh"
              formControlName="dataPrimeiraCnh">
          </div>
        </div>

        <div class="row">
          <div class="col-md-3 form-group">
            <label for="documentoOrigem" class="label">Origem</label>
            <input
              nbInput
              fullWidth
              id="documentoOrigem"
              placeholder="Origem..."
              formControlName="documentoOrigem">
          </div>

          <div class="col-md-9 form-group">
            <label for="observacao" class="label">Observação</label>
            <input
              nbInput
              fullWidth
              id="observacao"
              placeholder="Observação..."
              formControlName="observacao">
          </div>
        </div>
      </fieldset>
    </form>
  </nb-card-body>

  <nb-card-footer class="text-right">
    <button
      nbButton
      status="basic"
      type="button"
      class="mr-2"
      [disabled]="isLoadingSalvar"
      (click)="cancelar()">
      Cancelar
    </button>

    <button
      nbButton
      status="danger"
      type="button"
      [disabled]="documentoForm.invalid || isLoadingSalvar"
      (click)="salvar()">
      <nb-spinner
        *ngIf="isLoadingSalvar"
        size="tiny"
        class="button-spinner">
      </nb-spinner>

      {{ modoEdicao ? 'Salvar Alterações' : 'Enviar' }}
    </button>
  </nb-card-footer>
</nb-card>
